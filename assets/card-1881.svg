<svg width="560" height="250" viewBox="0 0 560 250" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="19-05-1881 — Interactive web experience about the life of Mustafa Kemal Atatürk: historical content, timeline, archives and educational resources.">
  <style>
    .pulse { animation: pulse 2s ease-in-out infinite; }
    .shine { animation: shine 6s ease-in-out infinite; }
    .border { stroke-dasharray: 120 1500; animation: dash 7s linear infinite; }
    
    @keyframes pulse { 0%,100% { opacity: 1 } 50% { opacity: .3 } }
    @keyframes shine { 0% { transform: translateX(-250px) } 60%,100% { transform: translateX(810px) } }
    @keyframes dash { to { stroke-dashoffset: -1620 } }
    @keyframes in { from { opacity: 0; transform: translateY(8px) } to { opacity: 1; transform: none } }
  </style>
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fb923c"/><stop offset="1" stop-color="#dc2626"/></linearGradient>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#060d1f"/><stop offset="1" stop-color="#030712"/></linearGradient>
    <radialGradient id="glow"><stop stop-color="#dc2626" stop-opacity=".35"/><stop offset="1" stop-color="#dc2626" stop-opacity="0"/></radialGradient>
    <linearGradient id="sh" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".06"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
    <clipPath id="clip"><rect width="560" height="250" rx="20"/></clipPath>
  </defs>
  <g clip-path="url(#clip)">
    <rect width="560" height="250" fill="url(#bg)"/>
    <circle cx="520" cy="20" r="170" fill="url(#glow)"/>
    <rect class="shine" x="0" y="0" width="200" height="250" fill="url(#sh)" transform="skewX(-20)"/>
  </g>
  <rect x="1" y="1" width="558" height="248" rx="19" fill="none" stroke="#1e293b" stroke-width="1.5"/>
  <rect class="border" x="1" y="1" width="558" height="248" rx="19" fill="none" stroke="url(#g)" stroke-width="2"/>
  <g class="in">
    <rect x="32" y="30" width="52" height="52" rx="14" fill="url(#g)"/>
    <g transform="translate(58 56)"><path d="M-16 -6 L0 -16 L16 -6 Z" fill="none" stroke="#fff" stroke-width="2.5" stroke-linejoin="round"/><path d="M-11 -2 V10 M-4 -2 V10 M4 -2 V10 M11 -2 V10 M-16 14 H16" stroke="#fff" stroke-width="2.5" stroke-linecap="round"/></g>
    <text x="100" y="58" fill="#f8fafc" font-family="'Segoe UI', Arial, sans-serif" font-size="27" font-weight="800">19-05-1881</text>
    <text x="101" y="78" fill="#64748b" font-family="Consolas, monospace" font-size="12.5" letter-spacing="1">19-05-1881.com.tr ↗</text>
