      <circle class="pulse" cx="14" cy="12" r="4" fill="#22c55e"/>
      <text x="24" y="16.5" fill="#22c55e" font-family="Consolas, monospace" font-size="11.5" font-weight="700" letter-spacing="1">LIVE</text>
    </g>
    <g transform="translate(445.2 64)">
      <text x="82.8" y="12" text-anchor="end" fill="#fb923c" font-family="Consolas, monospace" font-size="11.5" font-weight="700" letter-spacing="1.5">FEATURED</text>
    </g>
    <text x="32" y="118" fill="#94a3b8" font-family="'Segoe UI', Arial, sans-serif" font-size="15">Interactive web experience about the life of</text>
    <text x="32" y="138" fill="#94a3b8" font-family="'Segoe UI', Arial, sans-serif" font-size="15">Mustafa Kemal Atatürk: historical content,</text>
    <text x="32" y="158" fill="#94a3b8" font-family="'Segoe UI', Arial, sans-serif" font-size="15">timeline, archives and educational resources.</text>
